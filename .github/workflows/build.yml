name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    container:
      image: devkitpro/devkita64:20260219

    env:
      CCACHE_DIR: /ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install ccache
        run: apt-get update -q && apt-get install -y -q ccache cmake

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: /ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Restore FetchContent cache
        uses: actions/cache@v5
        with:
          path: /fetchcontent
          key: fetchcontent-${{ hashFiles('CMakeLists.txt', 'sysmodule/libs/mbedtls/CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake --preset switch-release \
            -DBUILD_APPLET=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_BASE_DIR=/fetchcontent

      - name: Build
        run: cmake --build --preset switch-release --target release

      - name: Upload release ZIP
        uses: actions/upload-artifact@v7
        with:
          name: kdeconnect-nx-dev
          path: cmake-build-release-devkita64/kdeconnect-nx-dev.zip
          archive: false

      - name: Upload debug symbols ZIP
        uses: actions/upload-artifact@v7
        with:
          name: debug-symbols
          path: cmake-build-release-devkita64/debug-symbols.zip
          archive: false

      - name: Create release draft
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            cmake-build-release-devkita64/kdeconnect-nx-dev.zip
            cmake-build-release-devkita64/debug-symbols.zip
