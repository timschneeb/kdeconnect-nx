name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219

    env:
      CCACHE_DIR: /ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ccache
        run: apt-get update -q && apt-get install -y -q ccache cmake

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Restore FetchContent cache
        uses: actions/cache@v4
        with:
          path: /fetchcontent
          key: fetchcontent-${{ hashFiles('CMakeLists.txt', 'sysmodule/libs/mbedtls/CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake --preset switch-release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_BASE_DIR=/fetchcontent

      - name: Build
        run: cmake --build --preset switch-release

      - name: Stage artifact
        run: |
          mkdir -p artifact/atmosphere/contents
          mkdir -p artifact/switch/.overlays
          cp -r cmake-build-release-devkita64/sysmodule/4DE000000C011EC7 \
             artifact/atmosphere/contents/4DE000000C011EC7
          cp cmake-build-release-devkita64/overlay/MiniKDEConnect_overlay.ovl \
             artifact/switch/.overlays/kdeconnect-nx.ovl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-nx
          path: artifact/
          include-hidden-files: true

      - name: Upload ELF files
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-nx-elf
          path: |
            cmake-build-release-devkita64/sysmodule/MiniKDEConnect_sysmodule.elf
            cmake-build-release-devkita64/overlay/MiniKDEConnect_overlay.elf
